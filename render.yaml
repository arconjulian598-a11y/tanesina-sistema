# Blueprint de Render: crea la base PostgreSQL y el servicio web juntos.
# En Render: New + → Blueprint → conecta este repositorio.
databases:
  - name: tamesina-db
    plan: free

services:
  - type: web
    name: tamesina
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tamesina-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 8h
